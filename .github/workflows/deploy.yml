name: deployec2-node

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build Angular app
      - name: Build project
        run: npm run build

      # Create folder on EC2
      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo mkdir -p /var/www/app
            sudo chown -R ubuntu:ubuntu /var/www/app

      # Deploy build files
      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: dist/angular-api-gateway-app/browser/
          TARGET: /var/www/app/
          ARGS: "-avz --delete"

      # Start app using Node (NO NGINX)
      - name: Start Angular app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Install serve if not present
            sudo apt update -y
            sudo apt install nodejs npm -y
            sudo npm install -g serve

            # Stop previous running app
            pkill -f serve || true

            # Start app in background
            nohup serve -s /var/www/app -l 80 > app.log 2>&1 &
