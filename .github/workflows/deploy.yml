name: deployec2-node

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build Angular
      - name: Build Angular
        run: npm run build

      # 🔍 Show dist structure (IMPORTANT for debugging)
      - name: Show dist folder
        run: ls -R dist

      # Set correct build folder dynamically
      - name: Detect build folder
        id: detect
        run: |
          BUILD_PATH=$(find dist -type f -name index.html | head -n 1 | sed 's|/index.html||')
          echo "BUILD_PATH=$BUILD_PATH" >> $GITHUB_ENV
          echo "Detected build path: $BUILD_PATH"

      # Prepare EC2 directory
      - name: Prepare EC2 folder
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo mkdir -p /var/www/app
            sudo chown -R ubuntu:ubuntu /var/www/app

      # Deploy files (auto-detected path)
      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: ${{ env.BUILD_PATH }}/
          TARGET: /var/www/app/
          ARGS: "-avz --delete"

      # Start app on EC2 (NO NGINX)
      - name: Start application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Install serve if not exists
            if ! command -v serve &> /dev/null
            then
              sudo npm install -g serve
            fi

            # Stop previous app
            pkill -f serve || true

            # Start app on port 80
            nohup serve -s /var/www/app -l 80 > app.log 2>&1 &
