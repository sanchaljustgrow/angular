name: Deploy Angular to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout repo
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Debug (optional but useful)
    - name: Debug Directory
      run: |
        echo "Current path:"
        pwd
        echo "Files:"
        ls -la
        echo "Angular file:"
        find . -name angular.json

    # 3. Setup Node (IMPORTANT FIX)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    # 4. Install dependencies (inside Angular folder)
    - name: Install Dependencies
      run: |
        cd angular-api-gateway-app
        rm -rf node_modules package-lock.json
        npm install

    # 5. Install Angular CLI (specific version)
    - name: Install Angular CLI
      run: npm install -g @angular/cli@16

    # 6. Build Angular
    - name: Build Angular App
      run: |
        cd angular-api-gateway-app
        ng build --configuration production

    # 7. Copy build files to EC2
    - name: Copy files to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: ${{ secrets.EC2_PORT }}
        source: "angular-api-gateway-app/dist/*"
        target: "/home/ubuntu/angular-app"

    # 8. Deploy on EC2
    - name: Deploy Application
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: ${{ secrets.EC2_PORT }}
        script: |

          echo "===== INSTALL NODE IF MISSING ====="
          if ! command -v node > /dev/null
          then
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          echo "===== INSTALL PM2 & SERVE ====="
          sudo npm install -g pm2 serve

          echo "===== STOP OLD APP ====="
          pm2 delete angular-app || true

          echo "===== START NEW APP ====="
          pm2 start "serve -s /home/ubuntu/angular-app -l 80" --name angular-app

          echo "===== SAVE PM2 ====="
          pm2 save

          echo "===== DEPLOYMENT DONE ====="
