name: deployec2-node

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Node.js for build
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build Angular app
      - name: Build project
        run: npm run build

      # Prepare EC2 directory
      - name: Prepare EC2 folder
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo mkdir -p /var/www/app
            sudo chown -R ubuntu:ubuntu /var/www/app

      # Deploy build files to EC2
      - name: Deploy files
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: dist/your-angular-project-name/browser/
          TARGET: /var/www/app/
          ARGS: "-avz --delete"

      # Run app on EC2 (NO NGINX)
      - name: Start application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Install serve if not installed
            if ! command -v serve &> /dev/null
            then
              sudo npm install -g serve
            fi

            # Stop previous app
            pkill -f serve || true

            # Start app in background
            nohup serve -s /var/www/app -l 80 > app.log 2>&1 &
