name: Deploy Angular to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup Node.js
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # 3. Clean install (fix Angular build issues)
    - name: Install Dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install

    # 4. Install Angular CLI
    - name: Install Angular CLI
      run: npm install -g @angular/cli@16

    # 5. Build Angular App
    - name: Build Angular App
      run: |
        if [ -f angular.json ]; then
          echo "Angular project found ✅"
          ng build --configuration production
        else
          echo "❌ angular.json NOT found. Fix your repo structure."
          exit 1
        fi

    # 6. Copy build to EC2
    - name: Copy files to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: ${{ secrets.EC2_PORT }}
        source: "dist/*"
        target: "/home/ubuntu/angular-app"

    # 7. Deploy on EC2 (FIXED NODE + PM2)
    - name: Deploy Application
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: ${{ secrets.EC2_PORT }}
        script: |
          echo "Installing Node.js (if missing)..."
          if ! command -v node &> /dev/null
          then
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          echo "Installing PM2 & serve..."
          sudo npm install -g pm2 serve

          echo "Stopping old app..."
          pm2 delete angular-app || true

          echo "Starting new app..."
          pm2 start "serve -s /home/ubuntu/angular-app -l 80" --name angular-app

          pm2 save
