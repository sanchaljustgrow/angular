name: Deploy EC2 Angular App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build Angular
      - name: Build Angular
        run: npm run build

      # 5. Show dist folder (debug)
      - name: Show dist folder
        run: ls -R dist

      # 6. Detect Angular build folder
      - name: Detect build folder
        run: |
          BUILD_PATH=$(find dist -type f -name index.html | head -n 1 | sed 's|/index.html||')
          echo "BUILD_PATH=$BUILD_PATH" >> $GITHUB_ENV
          echo "Detected build path: $BUILD_PATH"

      # 7. Prepare EC2 directory
      - name: Prepare EC2 folder
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo mkdir -p /var/www/app
            sudo chown -R ubuntu:ubuntu /var/www/app

      # 8. Deploy build files to EC2
      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: ${{ env.BUILD_PATH }}/
          TARGET: /var/www/app/
          ARGS: "-avz --delete"

      # 9. Start Angular app (NO NGINX)
      - name: Start Angular App with PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Install PM2 if missing
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            # Install serve if missing
            if ! command -v serve >/dev/null 2>&1; then
              sudo npm install -g serve
            fi

            # Stop old app (safe on first deploy)
            pm2 delete angular-app || true

            # Start Angular app on port 3000
            pm2 start "serve -s /var/www/app -l 3000" --name angular-app

            # Save PM2 state
            pm2 save
