```yaml
name: Deploy Angular to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup Node.js (Angular 21 requires Node 20+)
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 20

    # 3. Install dependencies (clean install)
    - name: Install Dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install

    # 4. Build Angular App (SSR project)
    - name: Build Angular App
      run: npm run build

    # 5. Copy build files to EC2
    - name: Copy files to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: ${{ secrets.EC2_PORT }}
        source: "dist/angular-api-gateway-app/browser/*"
        target: "/home/ubuntu/angular-app"

    # 6. Deploy on EC2
    - name: Deploy Application
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        port: ${{ secrets.EC2_PORT }}
        script: |
          echo "Updating server..."
          sudo apt update -y

          echo "Installing Node.js 20 (if not installed)..."
          if ! command -v node &> /dev/null
          then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          echo "Installing serve..."
          sudo npm install -g serve

          echo "Stopping old app..."
          pkill -f "serve" || true

          echo "Starting Angular app..."
          nohup serve -s /home/ubuntu/angular-app -l 80 > app.log 2>&1 &

          echo "Deployment completed ✅"
```
